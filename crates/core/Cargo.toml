[package]
name = "shibapack-core"
version = "0.1.0"
edition = "2021"
description = "ShibaPack 的核心逻辑：索引读写、识别、导入、整理。不依赖界面。"

[features]
default = ["network", "sqlite"]
# 联网取软件简介。关掉后核心库不带任何网络和加密依赖。
network = ["dep:ureq"]
# 清理时按保留名单删浏览器 Cookie 数据库里的记录。只用来改浏览器的 Cookie 文件，ShibaPack 自己的数据不用数据库
sqlite = ["dep:rusqlite"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
base64 = "0.23"
ico = "0.6"
sha2 = "0.10"
hex = "0.4"
regex = "1"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
plist = "1"
pelite = "0.10"
# MSI 安装包里的产品名、版本号、发布者（Property 表）
msi = "0.8"
memmap2 = "0.9"
# 卸载残留清理：文件和文件夹移到回收站（废纸篓），不直接删
trash = "5"
# 清理规则写在 TOML 里，编进程序
toml = "0.8"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
ureq = { version = "3", features = ["json"], optional = true }
# 磁盘分析的并行扫描：空闲线程从别的线程那里“偷”没扫的文件夹（work stealing），所有文件夹一起往前走
rayon = "1.10"
# 安装监控时实时监听文件改动（macOS 用 FSEvents，Windows 用 ReadDirectoryChangesW，Linux 用 inotify）
notify = "8.2"
sysinfo = { version = "0.40.4", default-features = false, features = ["system", "disk", "gpu"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_System_ApplicationInstallationAndServicing", "Win32_System_Environment", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
