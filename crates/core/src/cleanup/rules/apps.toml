# 常用应用的缓存。Slack、Discord、Notion、Obsidian、Claude 都是 Electron 应用，缓存的结构和 Chromium 一样：
# 网页缓存（Cache）、代码缓存（Code Cache）、显卡缓存（GPUCache 等），删了会自己重新生成。登录状态、设置、聊天记录都不在这些文件夹里。
# Spotify、Steam 没有官方说明哪些能删，不放进来。微信、企业微信、飞书、钉钉、QQ 也没有，而且缓存和聊天记录混在一起：
# 不写删文件的规则，只提醒用它们自带的清理（mod.rs 的 APP_TOOLS）。

[[rule]]
id = "apps.slack"
category = "apps"
risk = "safe"
app = "Slack"
processes = { macos = ["Slack"], windows = ["slack.exe"], linux = ["slack"] }
roots.macos = ["${app_support}/Slack/Cache", "${app_support}/Slack/Code Cache", "${app_support}/Slack/GPUCache", "${app_support}/Slack/DawnGraphiteCache", "${app_support}/Slack/DawnWebGPUCache", "${app_support}/Slack/logs"]
roots.windows = ["${roaming_app_data}/Slack/Cache", "${roaming_app_data}/Slack/Code Cache", "${roaming_app_data}/Slack/GPUCache", "${roaming_app_data}/Slack/logs"]
roots.linux = ["${xdg_config}/Slack/Cache", "${xdg_config}/Slack/Code Cache", "${xdg_config}/Slack/GPUCache", "${xdg_config}/Slack/logs"]
name = { zh = "Slack 缓存", en = "Slack cache" }
about = { zh = "Slack 存下的图片、文件预览、编译好的代码和日志。", en = "Images, file previews, compiled code and logs Slack keeps." }
effect = { zh = "下次打开会慢一点，图片要重新加载。登录状态和消息不受影响。", en = "Opens a little slower next time and images load again. Sign-in and messages are not affected." }
evidence = "https://www.electronjs.org/docs/latest/api/app"

