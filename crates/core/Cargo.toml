[package]
name = "shibapack-core"
version = "0.1.0"
edition = "2021"
description = "ShibaPack 的核心逻辑：索引读写、识别、导入、整理。不依赖界面。"

[features]
default = ["network"]
# 联网取软件简介。关掉后核心库不带任何网络和加密依赖。
network = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
plist = "1"
pelite = "0.10"
memmap2 = "0.9"
# 卸载残留清理：文件和文件夹移到回收站（废纸篓），不直接删
trash = "5"
ureq = { version = "3", features = ["json"], optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"
