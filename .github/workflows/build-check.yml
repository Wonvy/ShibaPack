# 推到 main 或提交 PR 时运行核心测试，并在 Linux 和 Windows 上检查桌面版编译。
#
# 编译失败时把错误原文写进 annotations：不登录 GitHub 也能看到（Actions 日志要登录才能看），
# 用 https://api.github.com/repos/Wonvy/ShibaPack/check-runs/<任务 id>/annotations 读。
# Linux 跑全套核心测试。Windows 和 macOS 跑和仓库写入相关的测试，避免全套测试里的系统路径假设。
name: build-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 全套核心测试
        if: runner.os == 'Linux'
        run: cargo test --locked -p shibapack-core
      - name: 仓库写入、整理和导入测试
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo test --locked -p shibapack-core store::tests
          cargo test --locked -p shibapack-core ops::tests
          cargo test --locked -p shibapack-core import::tests
          cargo test --locked -p shibapack-core leftovers::tests
      - name: Windows 卸载程序启动测试
        if: runner.os == 'Windows'
        run: cargo test --locked -p shibapack-core installed::platform

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux 上 Tauri 需要的系统库
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      # 桌面程序编译时要用到前端打包好的 dist
      - run: npm run build

      - name: 编译桌面程序（release）
        shell: bash
        # 不带颜色控制字符，annotations 里读起来才干净
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          if cargo build --release -p shibapack --features tauri/custom-protocol 2>&1 | tee build.log; then
            exit 0
          fi
          # 每个 error 连同后面几行写成一条 annotation（换行要写成 %0A）
          awk '/^error/ {n = 14} n > 0 {print; n--; if (n == 0) print "@@END@@"}' build.log | head -c 60000 > errors.log
          if [ ! -s errors.log ]; then tail -n 40 build.log > errors.log; fi
          awk 'BEGIN {RS = "@@END@@\n"} NF {gsub(/%/, "%25"); gsub(/\r/, ""); gsub(/\n/, "%0A"); print "::error title=编译失败::" $0}' errors.log | head -n 10
          exit 1

      - name: Windows 桌面回归
        if: runner.os == 'Windows'
        run: node tests/native/windows-smoke.mjs
