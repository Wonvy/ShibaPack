[[rule]]
id = "browser.firefox"
category = "browser"
risk = "safe"
app = "Firefox"
processes = { macos = ["firefox"], windows = ["firefox.exe"], linux = ["firefox", "firefox-bin", "firefox-esr"] }
# 只清本地配置文件夹里的缓存（cache2、启动缓存、缩略图），书签、历史、Cookie、密码在另一个文件夹里
roots.macos = [
  "${user_cache}/Firefox/Profiles/*/cache2",
  "${user_cache}/Firefox/Profiles/*/startupCache",
  "${user_cache}/Firefox/Profiles/*/thumbnails",
]
roots.windows = [
  "${local_app_data}/Mozilla/Firefox/Profiles/*/cache2",
  "${local_app_data}/Mozilla/Firefox/Profiles/*/startupCache",
  "${local_app_data}/Mozilla/Firefox/Profiles/*/thumbnails",
]
roots.linux = [
  "${xdg_cache}/mozilla/firefox/*/cache2",
  "${xdg_cache}/mozilla/firefox/*/startupCache",
  "${xdg_cache}/mozilla/firefox/*/thumbnails",
]
name = { zh = "Firefox 缓存", en = "Firefox cache" }
about = { zh = "Firefox 存下的网页文件、启动缓存和网页缩略图。", en = "Web files, startup cache and page thumbnails Firefox keeps." }
effect = { zh = "网站第一次打开会慢一点。登录状态、历史、密码、书签都不受影响。", en = "Sites load a little slower the first time. Sign-ins, history, passwords and bookmarks are not affected." }
evidence = "https://support.mozilla.org/kb/how-clear-firefox-cache"
