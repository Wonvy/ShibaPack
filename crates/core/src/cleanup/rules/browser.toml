# 浏览器：只清缓存（网页缓存、代码缓存、GPU 和着色器缓存），不碰历史、Cookie、密码、书签、扩展。
# `*` 是浏览器的各个配置（Default、Profile 1……）。清理前要先关掉浏览器。
#
# Chromium 系的缓存在 macOS 上分在两处：网页和代码缓存在 Caches 里，GPU、着色器缓存在 Application Support 的配置里；
# Linux 上同理分在 ~/.cache 和 ~/.config；Windows 上都在 User Data 下面。

[[rule]]
id = "browser.chrome"
category = "browser"
risk = "safe"
app = "Google Chrome"
processes = { macos = ["Google Chrome"], windows = ["chrome.exe"], linux = ["chrome"] }
roots.macos = [
  "${user_cache}/Google/Chrome/*/Cache",
  "${user_cache}/Google/Chrome/*/Code Cache",
  "${app_support}/Google/Chrome/*/GPUCache",
  "${app_support}/Google/Chrome/*/DawnGraphiteCache",
  "${app_support}/Google/Chrome/*/DawnWebGPUCache",
  "${app_support}/Google/Chrome/GrShaderCache",
  "${app_support}/Google/Chrome/GraphiteDawnCache",
  "${app_support}/Google/Chrome/ShaderCache",
]
roots.windows = [
  "${local_app_data}/Google/Chrome/User Data/*/Cache",
  "${local_app_data}/Google/Chrome/User Data/*/Code Cache",
  "${local_app_data}/Google/Chrome/User Data/*/GPUCache",
  "${local_app_data}/Google/Chrome/User Data/*/DawnGraphiteCache",
  "${local_app_data}/Google/Chrome/User Data/*/DawnWebGPUCache",
  "${local_app_data}/Google/Chrome/User Data/GrShaderCache",
  "${local_app_data}/Google/Chrome/User Data/GraphiteDawnCache",
  "${local_app_data}/Google/Chrome/User Data/ShaderCache",
]
roots.linux = [
  "${xdg_cache}/google-chrome/*/Cache",
  "${xdg_cache}/google-chrome/*/Code Cache",
  "${xdg_config}/google-chrome/*/GPUCache",
  "${xdg_config}/google-chrome/*/DawnGraphiteCache",
  "${xdg_config}/google-chrome/*/DawnWebGPUCache",
  "${xdg_config}/google-chrome/GrShaderCache",
  "${xdg_config}/google-chrome/GraphiteDawnCache",
  "${xdg_config}/google-chrome/ShaderCache",
]
name = { zh = "Chrome 缓存", en = "Chrome cache" }
about = { zh = "Chrome 存下的网页文件、脚本编译结果和显卡着色器，用来让常去的网站打开得快一点。", en = "Web files, compiled scripts and GPU shaders Chrome keeps so sites you visit often load faster." }
effect = { zh = "网站第一次打开会慢一点。登录状态、历史、密码、书签都不受影响。", en = "Sites load a little slower the first time. Sign-ins, history, passwords and bookmarks are not affected." }
evidence = "https://chromium.googlesource.com/chromium/src/+/HEAD/docs/user_data_dir.md"

