# 在三个系统上打包安装包和更新包。
#
# 推送形如 v0.2.0 的标签时运行（标签要和 package.json 里的 version 一致），也可以在 Actions 页面手动运行。
# 先建一个草稿 Release；三个系统各自打包，传到这个草稿里：各系统的安装包，以及（有签名私钥时）带签名的更新包和 latest.json。
# 三个系统全部打包成功后，最后一步自动把草稿发布出去，已安装的 ShibaPack 就会收到这次更新。
# 有任何一个系统失败，就停在草稿、不发布：修好后重新打包，或者在 GitHub 上检查后手动发布。
#
# 仓库的 Settings → Secrets and variables → Actions 里可以放：
#   TAURI_SIGNING_PRIVATE_KEY   ~/.tauri/shibapack-updater.key 的内容。可以不设：不设时只打安装包，
#                               不生成更新包和 latest.json，已安装的 ShibaPack 收不到这个版本的自动更新。
#   RELEASE_TOKEN               可以不设。设了就用它（而不是工作流自带的 GITHUB_TOKEN）创建、上传、发布 Release。
#                               只有 GitHub 不让 GITHUB_TOKEN 创建 Release、改了仓库设置也不行时才需要：
#                               建一个只对本仓库有效、带 Contents: Read and write 权限的 fine-grained token 放进来。
#
# 安装包本身没有做系统级签名：macOS 上首次打开要到“系统设置 → 隐私与安全性”里放行，
# Windows 上 SmartScreen 弹出时点“更多信息 → 仍要运行”。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p shibapack-core

  # 先把草稿 Release 建好，只建一次：三个系统各自打包完再去建，同时打完时会建出两个草稿。
  # 没有权限建 Release 时在这里就失败，不用等三个系统各打包十分钟才发现。
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
      body: ${{ steps.draft.outputs.body }}
    steps:
      - uses: actions/checkout@v5
      - name: 准备草稿 Release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          NOTES: |
            Download the installer for your system from the assets below. The installers are not code-signed yet; see the [README](https://github.com/Wonvy/ShibaPack#download) for how to open ShibaPack the first time on macOS and Windows.

            在下面的附件里下载对应系统的安装包。安装包还没有做系统级签名，首次打开的方法见 [README](https://github.com/Wonvy/ShibaPack/blob/main/README.zh-CN.md#下载)。
        run: |
          # 标签按 package.json 里的版本号来，和打包时 tauri-action 用的一致（手动运行时也对得上）
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # 这个版本的更新说明：CHANGELOG.md 里“## 版本号”那一节。放在 Release 说明的最前面，
          # 也交给 tauri-action 写进 latest.json，ShibaPack 的“软件更新”窗口显示的就是它。下载说明放在 --- 后面
          changes="$(awk -v v="$version" '$0 == "## " v {on = 1; next} /^## / {if (on) exit} on' CHANGELOG.md)"
          if [ -n "$(printf '%s' "$changes" | tr -d '[:space:]')" ]; then
            body="$(printf '%s\n\n---\n\n%s' "$changes" "$NOTES")"
          else
            echo "::warning title=没有更新说明::CHANGELOG.md 里没有“## $version”这一节，Release 和软件更新窗口里不会有这次的更新内容。"
            body="$NOTES"
          fi
          {
            echo "body<<__RELEASE_BODY__"
            printf '%s\n' "$body"
            echo "__RELEASE_BODY__"
          } >> "$GITHUB_OUTPUT"
          # 重新运行时草稿已经在了，接着用
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "已有 $tag 的 Release，接着用"
            exit 0
          fi
          if ! gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "ShibaPack $tag" --notes "$body"; then
            echo "::error title=GitHub 不让这个工作流创建 Release::多半是工作流的 GITHUB_TOKEN 只有读权限。到仓库的 Settings → Actions → General → Workflow permissions，选“Read and write permissions”并保存，然后重新运行。已经是读写还不行，就按 release.yml 开头的说明加一个 RELEASE_TOKEN。"
            exit 1
          fi
          echo "已建好草稿 $tag"

  build:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            targets: ""
          - os: ubuntu-22.04
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux 上 Tauri 需要的系统库
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2

      # 有签名私钥就生成带签名的更新包；没有就只打安装包（Tauri 要生成更新包时必须有私钥）
      - name: 更新包签名
        id: signing
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=没有签名私钥::仓库 Secret TAURI_SIGNING_PRIVATE_KEY 没有设置，这次只打安装包，不生成更新包和 latest.json。已安装的 ShibaPack 收不到这个版本的自动更新。"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "UNSIGNED_ARGS=--config src-tauri/tauri.no-updater.conf.json" >> "$GITHUB_ENV"
          fi

      - run: npm ci
      - run: npm run typecheck

      # 构建、上传到上一步建好的草稿 Release；有签名私钥时还给更新包签名，并生成更新用的 latest.json。
      # 草稿按标签找（tagName），latest.json 里的下载地址也按这个标签写
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # CI 上 Tauri 默认跳过给 DMG 窗口摆图标、放背景图（要用 AppleScript 控制访达）。打开它，磁盘映像才有背景图
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        with:
          tagName: ${{ needs.release.outputs.tag }}
          releaseName: ShibaPack ${{ needs.release.outputs.tag }}
          # 写进 latest.json 的 notes：软件更新窗口里显示的更新说明
          releaseBody: ${{ needs.release.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ steps.signing.outputs.signed == 'true' }}
          # latest.json 里通用的 windows-x86_64 指向 -setup.exe（当前用户安装，不要管理员权限），不是 MSI。
          # 新版 ShibaPack 会按自己是怎么装的去取 -nsis 或 -msi 那一项，这一条是给旧版用的
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ env.UNSIGNED_ARGS }}

      - name: Windows 桌面回归
        if: runner.os == 'Windows'
        run: node tests/native/windows-smoke.mjs

  # 三个系统都打包成功了才走到这里（有一个失败，这一步就不会运行，草稿留着不发布）。
  # 一发布，已安装的 ShibaPack 就会自动更新到这个版本。
  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 发布草稿 Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "已发布 $TAG"
