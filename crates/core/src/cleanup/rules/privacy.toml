# 隐私痕迹：浏览记录、Cookie、最近打开的文件。一律默认不勾、直接删除（进回收站等于没删），要先关掉浏览器。
# 只删名字列出来的这几个文件：书签（Bookmarks）、密码（Login Data）、自动填充（Web Data）、加密密钥（Local State）
# 在保护检查里一律不删。Firefox 的历史和书签在同一个文件（places.sqlite）里，不清。
# Cookie 有保留名单时，只删名单以外网站的 Cookie（改浏览器自己的 Cookie 数据库），不删整个文件。

[[rule]]
id = "privacy.chrome-history"
category = "privacy"
risk = "high"
permanent = true
app = "Google Chrome"
processes = { macos = ["Google Chrome"], windows = ["chrome.exe"], linux = ["chrome"] }
roots = { macos = ["${app_support}/Google/Chrome/*"], windows = ["${local_app_data}/Google/Chrome/User Data/*"], linux = ["${xdg_config}/google-chrome/*"] }
names = ["History", "History-journal", "Visited Links", "Top Sites", "Top Sites-journal", "Shortcuts", "Shortcuts-journal", "Network Action Predictor", "Network Action Predictor-journal"]
name = { zh = "Chrome 浏览记录", en = "Chrome browsing history" }
about = { zh = "Chrome 记下的访问过的网页、下载记录、常去的网站和地址栏的联想。", en = "Pages you visited, download history, top sites and address bar suggestions Chrome keeps." }
effect = { zh = "删了就找不回来。书签、密码、Cookie 不受影响。", en = "Cannot be recovered. Bookmarks, passwords and cookies are not affected." }
evidence = "https://support.google.com/chrome/answer/95589"

[[rule]]
id = "privacy.chrome-cookies"
category = "privacy"
risk = "high"
permanent = true
cookies = true
app = "Google Chrome"
processes = { macos = ["Google Chrome"], windows = ["chrome.exe"], linux = ["chrome"] }
roots = { macos = ["${app_support}/Google/Chrome/*", "${app_support}/Google/Chrome/*/Network"], windows = ["${local_app_data}/Google/Chrome/User Data/*", "${local_app_data}/Google/Chrome/User Data/*/Network"], linux = ["${xdg_config}/google-chrome/*", "${xdg_config}/google-chrome/*/Network"] }
names = ["Cookies", "Cookies-journal"]
name = { zh = "Chrome Cookie", en = "Chrome cookies" }
about = { zh = "网站存在 Chrome 里的 Cookie，用来记住登录状态、偏好，也用来跟踪你。", en = "Cookies websites store in Chrome to remember sign-ins and preferences, and to track you." }
effect = { zh = "保留名单以外的网站要重新登录。删了就找不回来。", en = "Sites not on your keep list will ask you to sign in again. Cannot be recovered." }
evidence = "https://support.google.com/chrome/answer/95589"

