# 在三个系统上打包安装包和更新包。
#
# 推送形如 v0.2.0 的标签时运行（标签要和 package.json 里的 version 一致），也可以在 Actions 页面手动运行。
# 结果是一个草稿 Release，里面有各系统的安装包、带签名的更新包和 latest.json。
# 检查无误后在 GitHub 上点“发布”，已安装的 ShibaPack 就会收到这次更新。
#
# 需要先在仓库的 Settings → Secrets and variables → Actions 里添加：
#   TAURI_SIGNING_PRIVATE_KEY   更新包的签名私钥（~/.tauri/shibapack-updater.key 的内容）
# 没有这个密钥，构建会在签名那一步失败。
#
# 安装包本身没有做系统级签名：macOS 上首次打开要到“系统设置 → 隐私与安全性”里放行，
# Windows 上 SmartScreen 弹出时点“更多信息 → 仍要运行”。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p shibapack-core

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            targets: ""
          - os: ubuntu-22.04
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 上 Tauri 需要的系统库
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2

      - name: 检查更新包的签名私钥
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error title=缺少签名私钥::仓库 Secret TAURI_SIGNING_PRIVATE_KEY 没有设置或是空的。到 Settings → Secrets and variables → Actions 添加，值是 ~/.tauri/shibapack-updater.key 的全部内容，然后重新运行。"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck

      # 构建、给更新包签名、上传到草稿 Release，并生成更新用的 latest.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: ShibaPack v__VERSION__
          releaseBody: |
            Download the installer for your system from the assets below. The installers are not code-signed yet; see the [README](https://github.com/Wonvy/ShibaPack#download) for how to open ShibaPack the first time on macOS and Windows.

            在下面的附件里下载对应系统的安装包。安装包还没有做系统级签名，首次打开的方法见 [README](https://github.com/Wonvy/ShibaPack/blob/main/README.zh-CN.md#下载)。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
