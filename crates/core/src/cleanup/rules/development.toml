  "${roaming_app_data}/Cursor/CachedExtensionVSIXs",
  "${roaming_app_data}/Cursor/Code Cache",
  "${roaming_app_data}/Cursor/GPUCache",
  "${roaming_app_data}/Cursor/logs",
]
roots.linux = [
  "${xdg_config}/Cursor/Cache",
  "${xdg_config}/Cursor/CachedData",
  "${xdg_config}/Cursor/CachedExtensionVSIXs",
  "${xdg_config}/Cursor/Code Cache",
  "${xdg_config}/Cursor/GPUCache",
  "${xdg_config}/Cursor/logs",
]
name = { zh = "Cursor 缓存", en = "Cursor cache" }
about = { zh = "Cursor 的界面缓存、编译好的代码、下载过的扩展安装包和日志。", en = "Cursor's interface cache, compiled code, downloaded extension packages and logs." }
effect = { zh = "下次打开会慢一点。设置、扩展、打开过的项目都不受影响。", en = "Opens a little slower next time. Settings, extensions and recent projects are not affected." }
evidence = "https://chromium.googlesource.com/chromium/src/+/HEAD/docs/user_data_dir.md"
